<div class="space-y-4 h-full flex flex-col">
  <div class="planner-card p-4">
    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-4">
      <div>
        <h2 class="text-xl font-extrabold text-slate-800">Budget</h2>
        <p id="budgetSubtitle" class="text-slate-500 text-sm">Category-level monthly budget vs actual for the selected account.</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
        <select id="v2BudgetAccount"
          class="p-2 border rounded-lg text-sm font-medium text-slate-700 outline-none focus:ring-1 focus:ring-indigo-500 min-w-[220px] bg-white">
          <option value="">Select account</option>
        </select>
        <input type="month" id="v2BudgetMonth"
          class="p-2 border rounded-lg text-sm font-medium text-slate-700 outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
      </div>
    </div>

    <div id="v2BudgetSetupHint" class="hidden mb-4 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3">
      Create expense categories first so they can appear in the monthly budget.
    </div>

    <div id="v2BudgetError" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>

    <div id="v2BudgetTotals" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"></div>

    <p id="v2BudgetEmptyHint" class="hidden text-sm text-slate-500 italic mb-4">No budget categories available for this month yet.</p>
    <div id="v2BudgetList" class="space-y-3"></div>
  </div>
</div>
