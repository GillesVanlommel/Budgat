<div class="space-y-4 h-full flex flex-col">
  <div class="planner-card p-4">
    <div class="flex justify-between items-end gap-3 mb-4">
      <div>
        <h2 class="text-xl font-extrabold text-slate-800">History</h2>
        <p class="text-slate-500 text-sm">Unified household ledger for expense, income, and transfers.</p>
      </div>
      <div id="v2HistoryResultsMeta" class="text-xs text-slate-500">0 results</div>
    </div>

    <div id="v2HistorySetupHint" class="hidden text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3 mb-3">
      This household still needs accounts or categories before the ledger becomes useful.
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
      <input type="text" id="v2HistorySearch" placeholder="Search description, note, account, category"
        class="w-full p-2 text-sm border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
      <input type="month" id="v2HistoryMonth"
        class="w-full p-2 text-sm border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-2">
      <select id="v2HistoryKind" class="w-full p-2 text-sm border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
        <option value="">All Types</option>
        <option value="expense">Expenses</option>
        <option value="income">Income</option>
        <option value="transfer">Transfers</option>
      </select>

      <select id="v2HistoryAccount" class="w-full p-2 text-sm border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
        <option value="">All Accounts</option>
      </select>

      <select id="v2HistoryCategory" class="w-full p-2 text-sm border rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
        <option value="">All Categories</option>
      </select>
    </div>

    <p id="v2HistoryEmptyHint" class="hidden text-sm text-slate-500 italic">No transactions match the current filters.</p>
    <div id="v2HistoryList" class="space-y-3"></div>
  </div>
</div>
