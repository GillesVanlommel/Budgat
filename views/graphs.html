<div class="space-y-6 pb-20">
  <header class="flex justify-between items-center gap-3">
    <div>
      <h2 class="text-xl font-bold text-slate-700">Analytics</h2>
      <p class="text-slate-500 text-sm">V2 household analytics from account-based transactions.</p>
    </div>
    <input type="month" id="v2GraphMonthSelector"
      class="p-2 border rounded-lg text-sm font-medium text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
  </header>

  <div id="v2GraphSetupHint" class="hidden text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3">
    Create a household first to view analytics.
  </div>

  <div id="v2GraphEmptyHint" class="hidden text-sm text-slate-500 italic">
    No transactions for this month yet.
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
      <p class="text-[10px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">Expense</p>
      <div id="v2MetricExpense" class="text-sm sm:text-base font-bold text-slate-800 mt-1">EUR 0.00</div>
    </div>
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
      <p class="text-[10px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">Income</p>
      <div id="v2MetricIncome" class="text-sm sm:text-base font-bold text-slate-800 mt-1">EUR 0.00</div>
    </div>
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
      <p class="text-[10px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">Net</p>
      <div id="v2MetricNet" class="text-sm sm:text-base font-bold text-slate-800 mt-1">EUR 0.00</div>
    </div>
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
      <p class="text-[10px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">Transfers</p>
      <div id="v2MetricTransfers" class="text-sm sm:text-base font-bold text-slate-800 mt-1">EUR 0.00</div>
    </div>
  </div>

  <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
    <h3 class="font-bold text-slate-700 mb-4 text-sm">Monthly Income vs Expense (6 months)</h3>
    <div class="relative h-64">
      <canvas id="v2MonthlyCashflowChart"></canvas>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h3 class="font-bold text-slate-700 mb-4 text-sm">Spending by Category</h3>
      <div class="relative h-64">
        <canvas id="v2SpendingByCategoryChart"></canvas>
      </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h3 class="font-bold text-slate-700 mb-4 text-sm">Account Activity</h3>
      <div class="relative h-64">
        <canvas id="v2AccountActivityChart"></canvas>
      </div>
    </div>
  </div>
</div>
