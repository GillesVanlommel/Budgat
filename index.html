<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #f3f4f0;
      color: #252d23;
    }

    .mono {
      font-family: 'Roboto Mono', monospace;
    }

    .planner-card {
      background: #fffef9;
      border: 1px solid #dbdccf;
      border-radius: 14px;
    }

    .planner-chip {
      border: 1px solid #dbdccf;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #687466;
      background: #fffef9;
    }
  </style>
</head>

<body>
  <div id="mainContainer" class="max-w-7xl mx-auto p-4 md:p-6 pb-8 transition-all duration-300 ease-in-out">
    <header class="planner-card p-4 mb-4">
      <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-3">
        <div>
          <h1 class="text-2xl font-extrabold text-slate-800">Budgat</h1>
          <p id="currentHouseholdName" class="text-sm font-semibold text-slate-700 mt-1">No household selected</p>
          <p id="currentHouseholdMeta" class="text-xs text-slate-500">Create a household to start setup.</p>
        </div>
        <div class="flex items-center gap-2">
          <div id="householdSwitcher" class="hidden">
            <select id="householdSelect" class="max-w-[220px] p-2 border border-slate-300 rounded-lg text-sm bg-white text-slate-700"></select>
          </div>
          <button id="toggleHouseholdCreateBtn"
            class="hidden border border-indigo-200 text-indigo-700 bg-indigo-50 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-100">
            New Household
          </button>
        </div>
      </div>

      <nav id="bottomNav" class="hidden mt-4 flex flex-wrap gap-2">
        <button class="nav-btn px-3 py-2 rounded-full text-xs font-bold border border-indigo-200 bg-indigo-50 text-indigo-700" data-target="view-add">Dashboard</button>
        <button class="nav-btn px-3 py-2 rounded-full text-xs font-bold border border-slate-300 bg-white text-slate-500" data-target="view-history">History</button>
        <button class="nav-btn px-3 py-2 rounded-full text-xs font-bold border border-slate-300 bg-white text-slate-500" data-target="view-budget">Budget</button>
        <button class="nav-btn px-3 py-2 rounded-full text-xs font-bold border border-slate-300 bg-white text-slate-500" data-target="view-graphs">Graphs</button>
        <button class="nav-btn px-3 py-2 rounded-full text-xs font-bold border border-slate-300 bg-white text-slate-500" data-target="view-settings">Settings</button>
      </nav>
    </header>

    <div id="authSection" class="planner-card p-6">
      <h2 class="text-lg font-semibold mb-4">Login or Sign Up</h2>
      <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-3 border rounded-lg">
      <input type="password" id="password" placeholder="Password" class="w-full p-2 mb-4 border rounded-lg">
      <button id="loginBtn"
        class="w-full bg-indigo-600 text-white py-2 rounded-lg mb-2 hover:bg-indigo-700">Login</button>
      <button id="signupBtn"
        class="w-full border border-indigo-600 text-indigo-600 py-2 rounded-lg hover:bg-indigo-50">Sign Up</button>
    </div>

    <div id="appSection" class="hidden">
      <div id="householdSetupSection" class="hidden planner-card p-6 mb-4">
        <h2 class="text-lg font-semibold mb-2 text-slate-800">Create Your First Household</h2>
        <p class="text-sm text-slate-500 mb-4">Households hold shared accounts, categories, budgets, and transactions.</p>

        <form id="householdCreateForm" class="space-y-3">
          <input type="text" id="householdNameInput" placeholder="Household Name" class="w-full p-2 border rounded-lg">
          <input type="text" id="householdDisplayNameInput" placeholder="Your Display Name (Optional)" class="w-full p-2 border rounded-lg">
          <input type="text" id="householdCurrencyInput" value="EUR" maxlength="3" class="w-full p-2 border rounded-lg uppercase">
          <div id="householdSetupError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>
          <button id="createHouseholdBtn" type="submit"
            class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">
            Create Household
          </button>
        </form>

        <div class="my-5 border-t border-slate-200"></div>

        <h3 class="text-base font-semibold mb-2 text-slate-800">Join Existing Household</h3>
        <p class="text-sm text-slate-500 mb-3">Enter an invite code shared by the household owner/admin.</p>

        <form id="householdJoinForm" class="space-y-3">
          <input type="text" id="householdInviteCodeInput" placeholder="Invite Code" class="w-full p-2 border rounded-lg uppercase">
          <input type="text" id="householdJoinDisplayNameInput" placeholder="Your Display Name (Optional)" class="w-full p-2 border rounded-lg">
          <div id="householdJoinError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>
          <button id="joinHouseholdBtn" type="submit"
            class="w-full border border-indigo-300 text-indigo-700 bg-indigo-50 py-2 rounded-lg font-medium hover:bg-indigo-100">
            Join Household
          </button>
        </form>

        <div class="mt-5 border-t border-slate-200 pt-4">
          <button data-logout="true" type="button"
            class="w-full border border-red-300 text-red-600 py-2 rounded-lg hover:bg-red-50 transition">
            Logout
          </button>
        </div>
      </div>

      <div id="householdAppContent" class="hidden">
        <div id="view-add"></div>
        <div id="view-history" class="hidden h-full"></div>
        <div id="view-budget" class="hidden"></div>
        <div id="view-graphs" class="hidden"></div>
        <div id="view-settings" class="hidden"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initApp } from './assets/js/index.js';

    initApp();
  </script>
</body>

</html>
